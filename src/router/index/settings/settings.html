<div
  class="card"
  id="settings"
  hx-get="/answer"
  hx-trigger="change"
  hx-include="#settings [name]"
  hx-target="#panel-answer"
  hx-swap="outerHTML"
>
  <div class="settings-grid">
    <div class="field field-lang">
      <label for="lang">Language</label>
      <select class="select" id="lang" name="lang">
        {% for language in languages %} {% if language.code == selected_language
        %}
        <option value="{{ language.code }}" selected>
          {{ language.name }}
        </option>
        {% else %}
        <option value="{{ language.code }}">{{ language.name }}</option>
        {% endif %} {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="min">Smallest number</label>
      <input
        class="input num"
        id="min"
        name="min"
        type="number"
        inputmode="numeric"
        min="0"
        max="10000000000"
        value="{{ min }}"
      />
    </div>
    <div class="field">
      <label for="max">Largest number</label>
      <div class="input-group">
        <input
          class="input num"
          id="max"
          name="max"
          type="number"
          inputmode="numeric"
          min="0"
          max="10000000000"
          value="{{ max }}"
        />
        <button
          type="button"
          class="btn btn-secondary btn-max"
          aria-label="Set largest number to 10000000000"
          onclick="
            const i = document.getElementById('max');
            i.value = i.max;
            i.dispatchEvent(new Event('change', { bubbles: true }));
          "
        >
          Max
        </button>
      </div>
      <p class="hint" id="range-hint" aria-live="polite"></p>
    </div>
    <div class="field">
      <label for="speed">Speech speed</label>
      <select class="select" id="speed" name="speed">
        {% for (value, name) in speeds %} {% if *value == selected_speed %}
        <option value="{{ value }}" selected>{{ name }}</option>
        {% else %}
        <option value="{{ value }}">{{ name }}</option>
        {% endif %} {% endfor %}
      </select>
    </div>
  </div>
</div>
