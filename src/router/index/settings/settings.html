<div class="card">
    <div class="settings-grid">
        <div class="field field-lang">
            <label for="lang">Language</label>
            <select class="select" id="lang" name="lang">
                {% for language in languages %}
                <option value="{{ language.code }}" {% if language.code==default_language %} selected{% endif %}>{{
                    language.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="min">Smallest number</label>
            <input class="input num" id="min" name="min" type="number" inputmode="numeric" min="0" max="10000000000"
                value="{{ min }}" />
        </div>
        <div class="field">
            <label for="max">Largest number</label>
            <input class="input num" id="max" name="max" type="number" inputmode="numeric" min="0" max="10000000000"
                value="{{ max }}" />
            <p class="hint" id="range-hint" aria-live="polite"></p>
        </div>
        <div class="field">
            <label for="speed">Speech speed</label>
            <select class="select" id="speed" name="speed">
                {% for (value, name) in speeds %}
                <option value="{{ value }}" {% if *value==default_speed %} selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
</div>
