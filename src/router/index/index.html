{% extends "layout.html" %} {% block content %}
<section class="section">
  <div class="container app-col stack" style="gap: var(--gap-lg)">
    <div class="stack" style="gap: var(--gap-xs)">
      <p class="eyebrow">Number listening</p>
      <h1>Hear the number.<br />Type the digits.</h1>
      <p class="lead">
        A spoken number in your target language. Your job: write it before you
        see it.
      </p>
    </div>

    {{ settings|safe }}

    <div class="card stack" style="gap: var(--gap-md); text-align: center">
      {{ answer|safe }}

      <!-- feedback -->
      <div
        id="panel-feedback"
        class="feedback-panel stack"
        style="gap: var(--gap-md)"
        hidden
      >
        {{ feedback|safe }}
      </div>
    </div>
  </div>
</section>
{% endblock content %}
